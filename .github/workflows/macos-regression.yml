name: macOS Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOLDTYPE_AUTOMATION: "1"
      HOLDTYPE_KEYCHAIN_AUTHENTICATION_UI: skip
    steps:
      - uses: actions/checkout@v7
      - name: Swift structure and diff
        run: |
          python3 scripts/check_swift_structure.py
          git diff --check
      - name: OpenAI package regression tests
        run: swift test --package-path Packages/HoldTypeOpenAI --scratch-path "$RUNNER_TEMP/openai-tests"
      - name: Build and test macOS application
        if: success() || failure()
        run: |
          xcodebuild -project HoldType.xcodeproj -scheme HoldType \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/holdtype-build" \
            -resultBundlePath "$RUNNER_TEMP/HoldType.xcresult" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build test
      - name: Package tested app for local smoke
        if: success() || failure()
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/holdtype-build/Build/Products/Debug/HoldType.app" \
            "$RUNNER_TEMP/HoldType-test.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-regression-evidence
          path: |
            ${{ runner.temp }}/HoldType.xcresult
            ${{ runner.temp }}/HoldType-test.zip
          retention-days: 1
          if-no-files-found: ignore
